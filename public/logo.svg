<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 80" fill="none">
  <defs>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#2fc6a0"/>
      <stop offset="0.34" stop-color="#2f8fd0"/>
      <stop offset="0.68" stop-color="#5a5cd0"/>
      <stop offset="1" stop-color="#8a4dff"/>
    </linearGradient>
  </defs>
  <g stroke="url(#bGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- lower ribbon: long sweep that dips then rises into a crest on the right -->
    <path d="M8 50 C40 52 58 60 86 52 C112 45 120 24 142 22 C168 19 176 44 200 30"/>
    <!-- upper ribbon: crosses over the lower and peaks higher -->
    <path d="M16 36 C48 38 66 30 92 38 C116 45 128 12 152 12 C178 12 184 34 206 18"/>
  </g>
</svg>
