<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none">
  <defs>
    <linearGradient id="bGrad" gradientUnits="userSpaceOnUse" x1="10" y1="125" x2="190" y2="10">
      <stop offset="0" stop-color="#6cae8e"/>
      <stop offset="0.4" stop-color="#4b7da6"/>
      <stop offset="0.7" stop-color="#46699f"/>
      <stop offset="1" stop-color="#7e5ec4"/>
