business_qa_notes:
  # General information discussed, NOT legal/tax advice — user should confirm with a
  # Texas attorney/CPA and their parents.
  context: User is 16, in Texas, weighing an LLC / how to operate & get paid for a SaaS.
  points:
    - texas_llc_minor: >
        Texas sets no minimum age to be an LLC member/organizer, so a 16-year-old can
        technically be listed. Practical blockers: minors can void ("disaffirm")
        contracts (so counterparties are wary), banks usually won't open a business
        account for under-18s, and the registered-agent role fits an adult better.
        Common path: a parent as co-member/manager/organizer.
    - ein: >
        EIN is free from the IRS (Form SS-4 / online); requires a "responsible party"
        with an SSN/ITIN. Smoother with a parent as responsible party. Never pay a
        third party just for an EIN.
    - llc_required_for_saas: >
        No — an LLC is not legally required to build/sell a SaaS. Can operate as a
        sole proprietor. Single-member LLC is taxed the same as a sole prop (no
        default tax break); its value is personal-asset liability protection, which
        matters more once there are real users/revenue.
    - protection_layers: >
        Three different jobs: LLC = shields personal assets; insurance (Tech E&O +
        Cyber for SaaS) = pays claims; Terms of Service + Privacy Policy = reduce
        risk / cap liability. Minor contract-disaffirmance does NOT protect against
        torts (data breach, IP infringement, privacy-law/COPPA, consumer claims) —
        minors are liable for their own torts. Pre-revenue, the highest-value free
        step is a solid ToS + Privacy Policy and minimizing data collected.
    - getting_paid_age_barrier: >
        The real gate at 16 is payment processing, not the entity: Stripe, PayPal,
        Fiverr, Payoneer, app stores all require 18+. Usual solution is a parent on
        the account, or a merchant-of-record (Lemon Squeezy / Paddle) for a SaaS.
    - fiverr: >
        Fiverr terms require 18+ (same barrier). It's a fixed-price gig/deliverable
        marketplace, not subscription SaaS billing, and takes 20%. Custom amounts are
        possible via Custom Offers + package tiers ($5 min); no true tracked hourly —
        that's Upwork's model (10% fee, real hourly + fixed contracts). A "per hour"
        gig can simulate hourly as unit price × quantity. Best fit for Fiverr would
        be freelance web-building services (under a parent's account), not the SaaS.
