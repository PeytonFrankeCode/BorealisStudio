  - title: New logo
    detail: >
      Replaced logo.svg with a hand-traced vector of the green→blue→purple
      wave-and-leaf mark (gradient ribbon, woven waves, leaf tip with inner vein).
      Note: user's uploaded PNG couldn't be committed directly at first; a close
      SVG recreation was used so it stays crisp at any size (nav, favicon, etc.).

  - title: Rebrand copy
    detail: >
      Renamed "Borealis Softwares" -> "Borealis Software" everywhere. Reworked the
      landing copy to a humble, portfolio tone ("We create websites") framing the
      site as the studio's portfolio; dropped the earlier "we only build our own
      sites / no client work" emphasis.

  - title: The Card Huddle portfolio card
    detail: >
      Added The Card Huddle (thecardhuddle.com) as the first portfolio card using
      the exact uploaded logo (trimmed + compressed to ~16KB). Created a dark-mode
      variant of the logo (navy parts lightness-inverted, greens kept) so it blends
      into the dark theme without a white chip. Linked to thecardhuddle.com.

  - title: SEO
    detail: >
      Added Google Search Console verification meta tag
      (google-site-verification=NbTmqG0CevhPE4z0Woi5_MUc_XO_qNrph2WYAw42Tac),
      robots.txt (dashboard disallowed), sitemap.xml, Organization JSON-LD, and an
      og.png social-preview image with Open Graph + Twitter card tags.

  - title: Deploy diagnosis (not a code bug)
    detail: >
      Site wasn't updating because the "Deploy to Cloudflare" GitHub Action was
      skipped on every push — repo variable ENABLE_CLOUDFLARE_DEPLOY was never set
      to 'true'. Merges to main were fine; deployment was the gap. Fix: set that
      variable + CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets on GitHub (or
      point Cloudflare's watched branch at main).

  - title: Analytics — visitor world map
    detail: >
      /collect records visitor country (Cloudflare request.cf, ISO alpha-2);
      dashboard shows a dependency-free SVG choropleth (Natural Earth via
      world-atlas) + top-countries list, wired to the range toggle.

  - title: Analytics — city bubbles + bot filtering
    detail: >
      Added city + coordinates (rounded to 0.1 deg ~11km for privacy; no raw IPs).
      Map shows sized city bubbles + top-cities list. Bots dropped before recording
      via user-agent blocklist + Cloudflare verifiedBotCategory signal.

  - title: Analytics — fine-grained time ranges + per-site maps
    detail: >
      Replaced fixed 7/30/90d with windows: 30m, 1h, 6h, 12h, 24h, 3d, 7d, 30d, 90d.
      Moved from day-buckets to timestamp windows (Worker /api/overview?minutes=N,
      adaptive bucketing shared by client+worker). Geo is now per-site, so each
      site's detail view has its own location map; overview and detail keep
      independent ranges.

  - title: Bugfix — dashboard chart grew on every redraw
    detail: >
      drawLineChart read canvas height from the attribute it then overwrote with
      the dpr-scaled value, so each redraw doubled the chart height on HiDPI.
      Fixed by capturing the intended height once in canvas.dataset.h.

  - title: Tracking snippet for the landing page
    detail: >
      Added the analytics beacon (site id edb8c5ab) to index.html to track
      borealissoftwares.com itself.

  - title: Chat widget bug (NOT this repo)
    detail: >
      thecardhuddle.com chat showed reversed text and missing DM sender names.
      That code lives in a separate Card Huddle repo (not BorealisStudio and not in
      this session's scope). Provided a diagnosis: likely CSS direction:rtl /
      unicode-bidi:bidi-override (or a JS string reverse) for the reversed text, and
      a different sender field / omitted name element on the Direct tab. To fix, run
      a session on that repo.

  - title: Time-log tracker (then made per-site)
    detail: >
      Added a stopwatch time tracker to the dashboard. Start reads the clock and
      counts up; Stop records the clock span + total duration and opens a notes
      field (add then or later). Persists to a new D1 time_logs table (admin-gated
      GET/POST/PATCH/DELETE /api/timelogs); running timer survives a refresh.
      Then moved it under each site: tracker lives in each site's detail view
      scoped to that site, each overview card shows a "Tracked" total-hours stat
      + a live "tracking" indicator, and time_logs gained a site_id (auto-migrated).

  - title: Manual time entry
    detail: >
      Added a "+ Add manually" form to each site's time log — pick start/end
      datetimes + optional notes to log a session without the stopwatch. Validated
      (end after start, not future) and sorted into the list by start time.

